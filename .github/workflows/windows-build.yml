name: Build Windows App

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\ImagePlatformSorter.sln

      - name: Build
        run: dotnet build .\ImagePlatformSorter.sln --configuration Release --no-restore

      - name: Publish win-x64
        run: dotnet publish .\ImagePlatformSorter\ImagePlatformSorter.csproj --configuration Release --runtime win-x64 --self-contained false --output .\artifacts\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImagePlatformSorter-win-x64
          path: .\artifacts\publish

